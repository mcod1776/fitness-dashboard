const ub = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function dec(pw) {
  const km = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveKey"]);
  const k = await crypto.subtle.deriveKey({name: "PBKDF2", salt: ub(P.salt), iterations: P.iter, hash: "SHA-256"}, km, {name: "AES-GCM", length: 256}, false, ["decrypt"]);
  const gz = await crypto.subtle.decrypt({name: "AES-GCM", iv: ub(P.iv)}, k, ub(P.ct));
  const s = new Blob([gz]).stream().pipeThrough(new DecompressionStream("gzip"));
  return await new Response(s).text();
}
async function open_(pw, remember) {
  const html = await dec(pw);
  if (remember) localStorage.setItem("fd_pw", pw); 
  try { sessionStorage.setItem("fd_iv", P.iv); } catch (_) {}
  document.open(); document.write(html); document.close();
}
document.getElementById("f").addEventListener("submit", async ev => {
  ev.preventDefault();
  const b = document.getElementById("b"), e = document.getElementById("e");
  b.disabled = true; b.textContent = "جاري فك التشفير…"; e.textContent = "";
  try { await open_(document.getElementById("p").value, document.getElementById("r").checked); }
  catch (x) { e.textContent = "كلمة المرور غير صحيحة"; b.disabled = false; b.textContent = "فتح اللوحة"; }
});
const saved = localStorage.getItem("fd_pw");
if (saved) open_(saved, true).catch(() => localStorage.removeItem("fd_pw"));
